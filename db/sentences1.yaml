# Sentencias SQL del sistema. Se ejecutan por nombre con db.exe("nombre", [parametros])
# Los parametros se mapean en orden con $1, $2, $3...

# --- Sesion ---

getUser: |
  SELECT id, username, password_hash
  FROM "user"
  WHERE username = $1 AND active

getUserProfiles: |
  SELECT p.id, p.name
  FROM profile p
  JOIN user_profile up ON up.profile_id = p.id
  WHERE up.user_id = $1
  ORDER BY p.name

# Crea la persona, su usuario y le asigna los perfiles en una sola sentencia,
# asi no queda una persona sin usuario si algo falla
registerUser: |
  WITH new_person AS (
    INSERT INTO person (document, first_name, last_name)
    VALUES ($1, $2, $3)
    RETURNING id
  ), new_user AS (
    INSERT INTO "user" (person_id, username, email, password_hash)
    SELECT id, $4, $5, $6 FROM new_person
    RETURNING id, username
  ), new_profiles AS (
    INSERT INTO user_profile (user_id, profile_id)
    SELECT new_user.id, profile.id
    FROM new_user, profile
    WHERE profile.name = ANY($7)
  )
  SELECT id, username FROM new_user

# --- Seguridad: lo que llena los mapas del objeto de seguridad ---

getPermission: |
  SELECT s.description AS subsystem, c.description AS class,
         m.description AS method, pm.profile_id, pm.value
  FROM method m
  INNER JOIN class c ON c.id = m.class_id
  INNER JOIN subsystem s ON s.id = c.subsystem_id
  INNER JOIN permission_method pm ON pm.method_id = m.id

getPermissionOption: |
  SELECT s.description AS subsystem, o.description AS option,
         po.profile_id, po.value
  FROM option o
  INNER JOIN subsystem s ON s.id = o.subsystem_id
  INNER JOIN permission_option po ON po.option_id = o.id

getTransactions: |
  SELECT m.tx, s.description AS subsystem, c.description AS class,
         m.description AS method
  FROM method m
  INNER JOIN class c ON c.id = m.class_id
  INNER JOIN subsystem s ON s.id = c.subsystem_id

# --- Mantenimiento de seguridad ---

# Para la pantalla de usuarios: cada usuario con su persona y los perfiles que tiene
getUsers: |
  SELECT u.id, u.username, u.email, u.active,
         p.document, p.first_name, p.last_name,
         COALESCE(
           json_agg(json_build_object('id', pr.id, 'name', pr.name) ORDER BY pr.name)
             FILTER (WHERE pr.id IS NOT NULL),
           '[]'
         ) AS profiles
  FROM "user" u
  JOIN person p ON p.id = u.person_id
  LEFT JOIN user_profile up ON up.user_id = u.id
  LEFT JOIN profile pr ON pr.id = up.profile_id
  GROUP BY u.id, p.id
  ORDER BY p.last_name, p.first_name

setActiveUser: |
  UPDATE "user" SET active = $2
  WHERE id = $1
  RETURNING id, username, active

addUserProfile: |
  INSERT INTO user_profile (user_id, profile_id)
  VALUES ($1, $2)
  ON CONFLICT DO NOTHING
  RETURNING user_id, profile_id

getProfiles: |
  SELECT p.id, p.name, COUNT(up.user_id)::int AS users
  FROM profile p
  LEFT JOIN user_profile up ON up.profile_id = p.id
  GROUP BY p.id
  ORDER BY p.name

createProfile: |
  INSERT INTO profile (name) VALUES ($1)
  RETURNING id, name

# El perfil admin no se cambia ni se borra
updateProfile: |
  UPDATE profile SET name = $2
  WHERE id = $1 AND name <> 'admin'
  RETURNING id, name

# Solo se borra si ningun usuario lo tiene; se lleva sus permisos
deleteProfile: |
  WITH perfil AS (
    SELECT id FROM profile
    WHERE id = $1 AND name <> 'admin'
      AND NOT EXISTS (SELECT 1 FROM user_profile WHERE profile_id = $1)
  ), pm AS (
    DELETE FROM permission_method WHERE profile_id IN (SELECT id FROM perfil)
  ), po AS (
    DELETE FROM permission_option WHERE profile_id IN (SELECT id FROM perfil)
  )
  DELETE FROM profile WHERE id IN (SELECT id FROM perfil)
  RETURNING id, name

# Los usa el objeto de seguridad en setPermissionMethod / setPermissionOption.
# Reciben las partes del key: subsistema, clase, metodo (u opcion), perfil y el value
setPermissionMethod: |
  INSERT INTO permission_method (profile_id, method_id, value)
  SELECT $4, m.id, $5
  FROM method m
  JOIN class c ON c.id = m.class_id
  JOIN subsystem s ON s.id = c.subsystem_id
  WHERE s.description = $1 AND c.description = $2 AND m.description = $3
  ON CONFLICT (profile_id, method_id) DO UPDATE SET value = EXCLUDED.value
  RETURNING profile_id, method_id, value

setPermissionOption: |
  INSERT INTO permission_option (profile_id, option_id, value)
  SELECT $3, o.id, $4
  FROM option o
  JOIN subsystem s ON s.id = o.subsystem_id
  WHERE s.description = $1 AND o.description = $2
  ON CONFLICT (profile_id, option_id) DO UPDATE SET value = EXCLUDED.value
  RETURNING profile_id, option_id, value

createSubsystem: |
  INSERT INTO subsystem (description) VALUES ($1)
  RETURNING id, description

createOption: |
  INSERT INTO option (subsystem_id, description) VALUES ($1, $2)
  RETURNING id, subsystem_id, description

deleteOption: |
  WITH removed AS (
    DELETE FROM permission_option WHERE option_id = $1
  )
  DELETE FROM option WHERE id = $1
  RETURNING id, description

createClass: |
  INSERT INTO class (subsystem_id, description) VALUES ($1, $2)
  RETURNING id, subsystem_id, description

deleteClass: |
  DELETE FROM class WHERE id = $1
  RETURNING id, description

createMethod: |
  INSERT INTO method (class_id, description, tx) VALUES ($1, $2, $3)
  RETURNING id, class_id, description, tx

deleteMethod: |
  WITH removed AS (
    DELETE FROM permission_method WHERE method_id = $1
  )
  DELETE FROM method WHERE id = $1
  RETURNING id, description, tx

getMethodInfo: |
  SELECT s.description AS subsystem, c.description AS class, m.description AS method
  FROM method m
  JOIN class c ON c.id = m.class_id
  JOIN subsystem s ON s.id = c.subsystem_id
  WHERE m.id = $1

getOptionInfo: |
  SELECT s.description AS subsystem, o.description AS option
  FROM option o
  JOIN subsystem s ON s.id = o.subsystem_id
  WHERE o.id = $1

# --- Pantalla de permisos: filtros de subsistema y clase ---

getSubsystems: |
  SELECT id, description FROM subsystem
  ORDER BY description

getClassesBySubsystem: |
  SELECT id, description FROM class
  WHERE subsystem_id = $1
  ORDER BY description

# Metodos de una clase con el value del perfil. Sin fila de permiso sale false
# $1 = clase, $2 = perfil
getMethodsByClass: |
  SELECT m.id, s.description AS subsystem, c.description AS class,
         m.description AS method, m.tx, COALESCE(pm.value, false) AS value
  FROM method m
  JOIN class c ON c.id = m.class_id
  JOIN subsystem s ON s.id = c.subsystem_id
  LEFT JOIN permission_method pm ON pm.method_id = m.id AND pm.profile_id = $2
  WHERE c.id = $1
  ORDER BY m.tx

# $1 = subsistema, $2 = perfil
getOptionsBySubsystem: |
  SELECT o.id, s.description AS subsystem, o.description AS option,
         COALESCE(po.value, false) AS value
  FROM option o
  JOIN subsystem s ON s.id = o.subsystem_id
  LEFT JOIN permission_option po ON po.option_id = o.id AND po.profile_id = $2
  WHERE s.id = $1
  ORDER BY o.description
